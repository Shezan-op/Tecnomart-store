      - heading "Frequently Asked Questions" [level=2] [ref=f12e592]
      - generic [ref=f12e593]:
        - generic [ref=f12e594]:
          - button "What does 'Certified Refurbished' mean?" [ref=f12e595] [cursor=pointer]
          - paragraph [ref=f12e600]: Every device undergoes a strict 90-point inspection by our certified technicians. We check everything from battery health and screen clarity to internal components and connectivity. Only devices that pass 100% of these tests are sold as Certified Refurbished.
        - generic [ref=f12e601]:
          - button "Do you offer a warranty?" [ref=f12e602] [cursor=pointer]
          - paragraph [ref=f12e607]: Yes, all our refurbished devices come with a standard 12-month hardware warranty. This covers any manufacturing defects or hardware failures that occur during normal use.
        - generic [ref=f12e608]:
          - button "Can I return a device if I don't like it?" [ref=f12e609] [cursor=pointer]
          - paragraph [ref=f12e614]: Absolutely. We offer a 7-day no-questions-asked return policy. If you're not completely satisfied with your purchase, you can return it for a full refund or exchange.
        - generic [ref=f12e615]:
          - button "Do you offer EMI or financing options?" [ref=f12e616] [cursor=pointer]
          - paragraph [ref=f12e621]: Yes, we partner with major banks to offer flexible EMI options, including No-Cost EMI on select models. You can see available options at checkout.
