    - generic [ref=f24e591]:
      - heading "Frequently Asked Questions" [level=2] [ref=f24e592]
      - generic [ref=f24e593]:
        - generic [ref=f24e594]:
          - button "What does 'Certified Refurbished' mean?" [ref=f24e595] [cursor=pointer]
          - paragraph [ref=f24e600]: Every device undergoes a strict 90-point inspection by our certified technicians. We check everything from battery health and screen clarity to internal components and connectivity. Only devices that pass 100% of these tests are sold as Certified Refurbished.
        - generic [ref=f24e601]:
          - button "Do you offer a warranty?" [ref=f24e602] [cursor=pointer]
          - paragraph [ref=f24e607]: Yes, all our refurbished devices come with a standard 12-month hardware warranty. This covers any manufacturing defects or hardware failures that occur during normal use.
        - generic [ref=f24e608]:
          - button "Can I return a device if I don't like it?" [ref=f24e609] [cursor=pointer]
          - paragraph [ref=f24e614]: Absolutely. We offer a 7-day no-questions-asked return policy. If you're not completely satisfied with your purchase, you can return it for a full refund or exchange.
        - generic [ref=f24e615]:
          - button "Do you offer EMI or financing options?" [ref=f24e616] [cursor=pointer]
          - paragraph [ref=f24e621]: Yes, we partner with major banks to offer flexible EMI options, including No-Cost EMI on select models. You can see available options at checkout.
