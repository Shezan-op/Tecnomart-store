    - generic [ref=f72e670]:
      - heading "Frequently Asked Questions" [level=2] [ref=f72e671]
      - generic [ref=f72e672]:
        - generic [ref=f72e673]:
          - button "What does 'Certified Refurbished' mean?" [ref=f72e674] [cursor=pointer]
          - paragraph [ref=f72e679]: Every device undergoes a strict 90-point inspection by our certified technicians. We check everything from battery health and screen clarity to internal components and connectivity. Only devices that pass 100% of these tests are sold as Certified Refurbished.
        - generic [ref=f72e680]:
          - button "Do you offer a warranty?" [ref=f72e681] [cursor=pointer]
          - paragraph [ref=f72e686]: Yes, all our refurbished devices come with a standard 12-month hardware warranty. This covers any manufacturing defects or hardware failures that occur during normal use.
        - generic [ref=f72e687]:
          - button "Can I return a device if I don't like it?" [ref=f72e688] [cursor=pointer]
          - paragraph [ref=f72e693]: Absolutely. We offer a 7-day no-questions-asked return policy. If you're not completely satisfied with your purchase, you can return it for a full refund or exchange.
        - generic [ref=f72e694]:
          - button "Do you offer EMI or financing options?" [ref=f72e695] [cursor=pointer]
          - paragraph [ref=f72e700]: Yes, we partner with major banks to offer flexible EMI options, including No-Cost EMI on select models. You can see available options at checkout.
