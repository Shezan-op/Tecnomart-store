<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Animated Particles Background -->
  <div id="particles"></div>

  <!--
    PRODUCT SHOWCASE — One rigid 250vh scene.
    We pin the master wrapper and pan the showcase up using GSAP.
    This guarantees the Display and Keyboard never change physical distance.
  -->
  <div id="master-pin-wrapper">
    <div class="product-showcase" id="productShowcase">

    <!-- ─────────────────────────────────────────
         1. DISPLAY SECTION
         Pinned to viewport. Lid opens on scroll.
         Scenes 1, 2, 3 happen here.
    ───────────────────────────────────────── -->
    <div class="display-section" id="displaySection">

      <div class="device preserve-3d" id="displayUnit">

        <!-- Base Keyboard Deck -->
        <div class="base-top preserve-3d">
          <div class="keyboard-well" id="laptopKeyboardWell"></div>
          <div class="trackpad"></div>
          <!-- USB port on the right edge — cable anchors here -->
          <div class="display-connector" id="displayConnector"></div>
        </div>

        <!-- Front lip / thumb groove -->
        <div class="base-edge preserve-3d">
          <div class="thumb-groove"></div>
        </div>

        <!-- Lid (opens via GSAP) -->
        <div class="lid preserve-3d" id="displayPanel">
          <div class="lid-back preserve-3d"></div>
          <div class="lid-edge preserve-3d" id="lidEdge"></div>
          <div class="lid-screen preserve-3d">
            <div class="screen-glass">
              <div class="screen-content" id="screenContent"></div>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- ─────────────────────────────────────────
         2. CABLE LAYER
         Static SVG — already in DOM.
         Invisible at start, revealed via dashoffset.
         Anchored by CSS to the Display USB port.
    ───────────────────────────────────────── -->
    <div class="cable-layer" id="cableLayer">
      <svg
        class="cable-svg"
        viewBox="0 0 100 100"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <!-- The glowing blue outline (rendered behind) -->
        <path
          class="cable-outline"
          d="M 100,0 C 140,0 140,50 100,50 C 60,50 60,100 0,100"
        />
        <!-- The dynamic solid core (rendered on top) -->
        <path
          class="cable-core"
          id="hardwareCable"
          d="M 100,0 C 140,0 140,50 100,50 C 60,50 60,100 0,100"
        />
      </svg>
    </div>

    <!-- ─────────────────────────────────────────
         3. ACCESSORIES TEXT
         Fades in during Scene 4.
    ───────────────────────────────────────── -->
    <div class="accessories-text" id="accessoriesText">
      <h2 class="accessories-heading">Accessories</h2>
      <p>Get the best and finest tech accessories at an affordable price.</p>
    </div>

    <!-- ─────────────────────────────────────────
         4. KEYBOARD SECTION
         Powers on when cable connects.
         Keys become interactive (clickable).
    ───────────────────────────────────────── -->
    <div class="keyboard-section" id="keyboardSection">
      <div class="keyboard-wrap" id="keyboardContainer">
        <div class="case">
          <!-- USB port at top — cable targets this -->
          <div class="usb-port" id="keyboardConnector"></div>
          <div class="indicator-led"></div>
          <div class="plate" id="plate">

            <div class="blockers-layer">
              <div class="blocker" style="left:0;top:calc(1*var(--u));width:calc(16.5*var(--u));height:calc(.25*var(--u))"></div>
              <div class="blocker" style="left:calc(1*var(--u));top:0;width:calc(1*var(--u));height:calc(1*var(--u))">
                <div class="pill-cutout" style="top:50%;height:14px;"></div>
              </div>
              <div class="blocker" style="left:calc(6*var(--u));top:0;width:calc(.5*var(--u));height:calc(1*var(--u))"></div>
              <div class="blocker" style="left:calc(10.5*var(--u));top:0;width:calc(.5*var(--u));height:calc(1*var(--u))"></div>
              <div class="blocker" style="left:calc(15*var(--u));top:0;width:calc(.25*var(--u));height:calc(6.25*var(--u))"></div>
              <div class="blocker" style="left:calc(16.25*var(--u));top:0;width:calc(.25*var(--u));height:calc(6.25*var(--u))"></div>
              <div class="knob-fill" style="position:absolute;left:calc(15.25*var(--u));top:0;width:calc(1*var(--u));height:calc(1*var(--u));background:var(--case-bg);">
                <div style="position:absolute;left:2px;top:2px;width:calc(100% - 4px);height:calc(100% - 4px);background:#111;border-radius:50%;box-shadow:inset 0 4px 8px rgba(0,0,0,0.8);"></div>
              </div>
            </div>

            <!-- Keys injected via JS -->
          </div>
        </div>
      </div>
    </div>

  </div><!-- /product-showcase -->
  </div><!-- /master-pin-wrapper -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
