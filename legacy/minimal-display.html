<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Display Reveal Component</title>
  
  <style>
    :root {
      --device-width: min(72vw, 1100px);
      --device-depth: min(46vw, 700px);
      --panel-thickness: 8px;
      --lid-thickness: 5px;
      --corner-radius: 22px;
      --screen-radius: 16px;
      --bezel-width: 10px;
      --perspective: 2500px;
    }

    @media (max-width: 1024px) {
      :root {
        --perspective: 2000px;
        --device-width: min(85vw, 800px);
        --device-depth: min(55vw, 500px);
      }
    }

    @media (max-width: 768px) {
      :root {
        --device-width: min(92vw, 460px);
        --device-depth: min(60vw, 300px);
        --panel-thickness: 6px;
        --lid-thickness: 4px;
        --corner-radius: 16px;
        --screen-radius: 12px;
        --bezel-width: 6px;
        --perspective: 1500px;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808; 
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    .preserve-3d { transform-style: preserve-3d; }

    .reveal-section {
      height: 300vh;
      position: relative;
      width: 100%;
    }

    .scene {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: var(--perspective);
      perspective-origin: 50% 50%;
      overflow: hidden;
    }

    .device {
      position: relative;
      width: var(--device-width);
      height: var(--device-depth);
      will-change: transform;
      transform: translateZ(-500px) rotateX(90deg);
    }

    /* ==========================================================
       BASE PANEL (Keyboard Deck)
       ========================================================== */
    .base-top {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #8B9098 0%, #BFC3C9 18%, #D7DBE0 50%, #BFC3C9 100%);
      border-radius: var(--corner-radius);
      border: 1px solid rgba(255,255,255,0.1);
      transform: translateZ(var(--panel-thickness));
    }
    
    /* Realistic Keyboard Grid */
    .keyboard-well {
      position: absolute;
      top: 15%;
      left: 7%; /* Widened to align better with the screen edges */
      right: 7%;
      height: 42%;
      background-color: #121315; 
      border-radius: 8px;
      box-shadow: 
        inset 0 4px 15px rgba(0,0,0,0.8),
        0 1px 1px rgba(255,255,255,0.3);
      padding: 6px;
      
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
    }

    .key {
      flex: 1 1 5%; /* Roughly 15 keys across */
      height: 14%; /* 6 rows */
      background: #0f1012;
      border-radius: 4px;
      border: 1px solid #000;
      box-shadow: 
        inset 0 1px 1px rgba(255,255,255,0.05),
        0 2px 2px rgba(0,0,0,0.5),
        0 0 2px rgba(255, 255, 255, 0.15); /* Soft ambient backlight bleed */
        
      /* Center the backlit line */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* The backlit "letter" / line */
    .key::after {
      content: '';
      width: 12px;
      height: 2px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 2px;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.5); /* Glowing backlit effect */
    }

    .key.spacebar { flex: 1 1 35%; }
    /* Wider backlight for spacebar */
    .key.spacebar::after { width: 50px; }
    
    .key.mod { flex: 1 1 8%; }

    /* Trackpad */
    .trackpad {
      position: absolute;
      bottom: 8%;
      left: 33%;
      right: 33%;
      height: 25%;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      box-shadow: 
        inset 0 1px 4px rgba(0,0,0,0.15),
        0 1px 0 rgba(255,255,255,0.3);
    }

    /* Base Front Edge */
    .base-edge {
      position: absolute;
      left: 0;
      bottom: 0; 
      width: 100%;
      height: var(--panel-thickness);
      background: linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 50%, rgba(255,255,255,0.1) 100%), #BFC3C9;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 0 0 var(--corner-radius) var(--corner-radius);
      transform-origin: bottom center;
      transform: rotateX(-90deg) translateY(var(--panel-thickness));
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
      display: flex;
      justify-content: center;
    }

    .thumb-groove {
      width: 120px;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.25), transparent);
      border-radius: 4px 4px 0 0;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* ==========================================================
       DISPLAY PANEL (LID)
       ========================================================== */
    .lid {
      position: absolute;
      top: 0; 
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: top center;
      will-change: transform;
      /* Hinges perfectly at the keyboard deck */
      transform: translateZ(var(--panel-thickness)) rotateX(0deg);
    }

    /* The silver casing exterior of the laptop lid */
    .lid-back {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #F5F7FA, #BFC3C9);
      border-radius: var(--corner-radius);
      border: 1px solid rgba(255,255,255,0.4);
      transform: translateZ(var(--lid-thickness));
    }

    /* The active display screen, including the clean silver frame bezel */
    .lid-screen {
      position: absolute;
      inset: 0;
      background: #D7DBE0; /* Silver Frame / Bezel */
      border: 2px solid #fff;
      border-radius: var(--corner-radius);
      /* Faces down when closed (touching keyboard) */
      transform: translateZ(0px) rotateX(180deg); 
    }

    /* The lid thickness lip (visible when closed, fades out when open to prevent corner bugs) */
    .lid-edge {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--lid-thickness);
      background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent, rgba(255,255,255,0.1)), #BFC3C9;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: var(--corner-radius) var(--corner-radius) 0 0;
      transform-origin: bottom center;
      transform: rotateX(-90deg) translateY(var(--lid-thickness));
    }

    .screen-glass {
      position: absolute;
      inset: var(--bezel-width); /* Creates the visible silver frame around the display! */
      background: #050505; 
      border-radius: var(--screen-radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: linear-gradient(135deg, rgba(255,255,255,0.05), transparent 35%);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5); /* Deep inset shadow */
    }

    .screen-content {
      opacity: 0;
      will-change: opacity;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }


  </style>
</head>
<body>


  <div class="reveal-section">
    <div class="scene">
      
      <div class="device preserve-3d" id="device">
        
        <div class="base-top preserve-3d">
          <div class="keyboard-well" id="keyboardWell"></div>
          <div class="trackpad"></div>
        </div>

        <div class="base-edge preserve-3d">
          <div class="thumb-groove"></div>
        </div>

        <div class="lid preserve-3d" id="lid">
          
          <div class="lid-back preserve-3d"></div>
          <div class="lid-edge preserve-3d" id="lidEdge"></div>
          
          <div class="lid-screen preserve-3d">
            <div class="screen-glass">
              <div class="screen-content" id="screenContent">
              </div>
            </div>
          </div>
          
        </div>

      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  
  <script>
    // Build Realistic Keyboard dynamically
    const kb = document.getElementById('keyboardWell');
    for(let i=0; i<70; i++) {
        let key = document.createElement('div');
        key.className = 'key';
        if(i === 57) key.classList.add('spacebar');
        if([13, 27, 40, 54, 68].includes(i)) key.classList.add('mod');
        kb.appendChild(key);
    }

    gsap.registerPlugin(ScrollTrigger);

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: ".reveal-section",
        start: "top top",
        end: "bottom bottom",
        scrub: 1.5,
      }
    });

    tl.addLabel("closed");

    tl.to("#device", {
      z: 0, 
      ease: "power1.inOut",
      duration: 1
    });
    tl.addLabel("approach");

    tl.to({}, { duration: 0.3 });
    tl.addLabel("hold");

    tl.to("#lid", {
      rotateX: 110, 
      ease: "power2.inOut",
      duration: 2
    }, "open");
    
    // Pan device to keep centered
    tl.to("#device", {
      yPercent: 45, 
      ease: "power2.inOut",
      duration: 2
    }, "open");
    
    // Fade out the front lip of the lid to prevent CSS corner artifacts at high angles!
    tl.to("#lidEdge", {
      opacity: 0,
      ease: "power2.in",
      duration: 1
    }, "open");
    
    tl.addLabel("open");


    tl.to({}, { duration: 0.2 });
    tl.addLabel("complete");

  </script>
</body>
</html>
